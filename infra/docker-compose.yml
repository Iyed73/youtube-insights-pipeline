# YouTube Trend Analysis Pipeline — Local Development Infrastructure
#
# Start everything:  docker compose -f infra/docker-compose.yml up -d
# Tear down:         docker compose -f infra/docker-compose.yml down -v
#
# Service port map (host → container):
#   8080  Kafka UI
#   8081  Schema Registry
#   8082  Flink Web UI
#   8083  Spark Master Web UI
#   8085  Airflow Web UI
#   8123  ClickHouse HTTP
#   9000  ClickHouse Native TCP
#   9092  Kafka (internal — for Dockerised services)
#   9094  Kafka (external — for services running directly on the host)
#   5432  PostgreSQL

version: "3.8"

# ── Shared Airflow config (reused across webserver, scheduler, init) ─────────
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  volumes:
    - ../orchestration/dags:/opt/airflow/dags      # DAG definitions
    - ../orchestration/plugins:/opt/airflow/plugins # Custom Airflow plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── Kafka (KRaft mode — no ZooKeeper required) ────────────────────────────
  # Central message broker.  The ingestion service publishes raw comments here;
  # Flink consumes them for stream processing.
  # Two listeners:
  #   PLAINTEXT://kafka:9092    used by Dockerised services (Flink, Schema Registry)
  #   EXTERNAL://localhost:9094 used when running ingestion directly on the host
  kafka:
    image: apache/kafka-native:3.9.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-broker dev defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Pre-generated cluster ID for KRaft (any valid base64-encoded UUID works)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Schema Registry (Confluent) ───────────────────────────────────────────
  # Official Confluent Schema Registry — the reference implementation.
  # Exposes the standard REST API on :8081.
  # Schemas are stored inside a Kafka topic (_schemas), so no extra storage.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: FULL
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  # Browser-based UI to inspect Kafka topics, browse messages, manage consumer
  # groups, and view registered Avro schemas — essential for local debugging.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: String
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: SchemaRegistry

  # ── Flink JobManager ─────────────────────────────────────────────────────
  # Flink cluster coordinator: accepts job submissions, distributes tasks to
  # TaskManagers, and serves the Flink Web UI (real-time job monitoring).
  # Runs the sentiment-analysis streaming job against the raw-comments topic.
  flink-jobmanager:
    image: flink:1.18-java11
    ports:
      - "8082:8081"   # Flink Web UI
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Flink TaskManager ─────────────────────────────────────────────────────
  # Flink worker: executes streaming operators (comment parsing, sentiment
  # scoring, windowed aggregations) and writes results to ClickHouse.
  flink-taskmanager:
    image: flink:1.18-java11
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  # ── Spark Master ──────────────────────────────────────────────────────────
  # Spark cluster coordinator: accepts PySpark job submissions from Airflow
  # DAGs and distributes work to Spark Workers for batch aggregations
  # (per-channel totals, tracked-video counts, historical trend rollups).
  spark-master:
    image: apache/spark:3.5.7
    ports:
      - "7077:7077"   # spark-submit endpoint
      - "8083:8080"   # Spark Master Web UI
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  # ── Spark Worker ─────────────────────────────────────────────────────────
  # Spark executor: processes PySpark tasks assigned by the master and writes
  # aggregated results to ClickHouse for dashboard consumption.
  spark-worker:
    image: apache/spark:3.5.7
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - 2G
      - --cores
      - "2"
      - spark://spark-master:7077

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Relational store serving two purposes:
  #   1. airflow DB   — Airflow metadata (DAG runs, task states, XComs)
  #   2. ingestion DB — ingestion state (which videos are tracked per channel,
  #                     last-seen comment timestamp for the inactivity rule)
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB:-airflow}   # Airflow metadata DB (auto-created)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── ClickHouse ────────────────────────────────────────────────────────────
  # Columnar analytics database — the unified sink for both pipeline views:
  #   Speed view  : Flink writes real-time sentiment scores per video/channel
  #   Batch view  : Spark writes scheduled aggregations (comment counts, etc.)
  # Powers any analytics dashboard or ad-hoc query layer on top of the pipeline.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"   # HTTP interface  (dashboards, curl, DBeaver)
      - "9000:9000"   # Native TCP      (Flink & Spark ClickHouse connectors)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Init ──────────────────────────────────────────────────────────
  # One-shot bootstrap container: runs DB migrations and creates the default
  # admin user on first start, then exits with code 0.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # ── Airflow Webserver ─────────────────────────────────────────────────────
  # Airflow UI: browse DAGs, trigger runs manually, inspect task logs.
  # Handles ingestion scheduling (video-list refresh, comment polling) and
  # Spark batch job submission.
  airflow-webserver:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"   # Airflow Web UI
    command: webserver

  # ── Airflow Scheduler ─────────────────────────────────────────────────────
  # Airflow brain: evaluates cron schedules and dispatches tasks via
  # LocalExecutor (no separate Celery workers needed for local development).
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  postgres-data:     # Airflow metadata + ingestion tracking state
  clickhouse-data:   # Speed-view sentiment scores + batch aggregation results
  airflow-logs:      # Airflow task execution logs
