x-airflow-common: &airflow-common
  image: youtube-insights/airflow:latest
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Forwarded by the DAGs into their task containers (orchestration/dags/common/containers.py).
    POSTGRES_USER: ${POSTGRES_USER:-airflow}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    INGESTION_DB: ${INGESTION_DB:-ingestion}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_VIDEOS_BUCKET: ${MINIO_VIDEOS_BUCKET:-videos}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    # Forwarded only when set in .env; otherwise the jobs' defaults apply.
    ANTHROPIC_MODEL:
    LDA_MAX_TOPICS:
    LDA_MAX_ITER:
    DOWNLOAD_LOOKBACK_DAYS:
    TOP_VIDEOS_TO_DOWNLOAD:
    MIN_COMMENTS_FOR_DOWNLOAD:
  volumes:
    - ../orchestration/dags:/opt/airflow/dags
    - ../orchestration/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:

  kafka:
    container_name: kafka
    image: apache/kafka-native:3.9.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  schema-registry:
    container_name: schema-registry
    image: apicurio/apicurio-registry:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/apis/ccompat/v7/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-ui:
    container_name: kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: String
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: SchemaRegistry

  flink-jobmanager:
    container_name: flink-jobmanager
    image: flink:1.18-java11
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
    volumes:
      - ../models:/opt/flink/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  flink-taskmanager:
    container_name: flink-taskmanager
    image: flink:1.18-java11
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        classloader.parent-first-patterns.additional: ai.djl;ai.onnxruntime
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      MODEL_DIR: /opt/flink/models/twitter-roberta-sentiment
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-2}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
    volumes:
      - ../models:/opt/flink/models:ro
      - ../config:/opt/flink/config:ro

  spark-master:
    container_name: spark-master
    # Also the image of the batch_topic_modeling DAG's task containers.
    image: youtube-insights/spark:latest
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
      args:
        - WHISPER_MODEL
    ports:
      - "7077:7077"
      - "8083:8080"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker:
    image: youtube-insights/spark:latest
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
      args:
        - WHISPER_MODEL
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_DIR: /tmp/spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - 2G
      - --cores
      - "2"
      - spark://spark-master:7077

  postgres:
    container_name: postgres
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DB: analytics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.d:/docker-entrypoint-initdb.d:ro
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    container_name: airflow-init
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    container_name: airflow-webserver
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    command: webserver

  airflow-scheduler:
    container_name: airflow-scheduler
    <<: *airflow-common
    # Grants the airflow user access to the Docker socket for DockerOperator.
    # DOCKER_GID must match `stat -c '%g' /var/run/docker.sock` on the host.
    group_add:
      - "${DOCKER_GID:-969}"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  comment-poller:
    container_name: comment-poller
    image: youtube-insights/ingestion:latest
    build:
      context: ..
      dockerfile: infra/ingestion/Dockerfile
    command: ["python3", "-m", "comment_poller.main", "--interval", "30"]
    restart: unless-stopped
    # Room to finish the pass in progress on shutdown (see comment_poller/main.py).
    stop_grace_period: 2m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      INGESTION_DB: ${INGESTION_DB:-ingestion}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      MAX_COMMENTS_PER_POLL:
      COMMENT_INACTIVITY_HOURS:

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
  airflow-logs:
  minio-data:

networks:
  default:
    # Must match DOCKER_NETWORK in orchestration/dags/common/containers.py.
    name: youtube-insights
