[project]
name = "youtube-insights-orchestration"
version = "0.1.0"
description = "Airflow DAGs and plugins for pipeline orchestration"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["dags", "plugins"]
