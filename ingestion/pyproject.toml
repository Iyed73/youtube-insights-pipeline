[project]
name = "youtube-insights-ingestion"
version = "0.1.0"
description = "YouTube API pollers and Kafka Avro producers"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "confluent-kafka>=2.3.0",
    "fastavro>=1.9.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "authlib>=1.3.0",
    "cachetools>=5.3.0",
    "attrs>=23.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["channel_discovery", "comment_poller", "viral_collector", "producers"]
