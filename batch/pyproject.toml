[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-insights-batch"
version = "0.1.0"
description = "PySpark batch jobs for deep multi-modal video analysis"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.0.0,<4.2",
    "faster-whisper>=1.0.0",
    "clickhouse-connect>=0.7.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0",
    "minio>=7.2.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "anthropic>=0.39.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["jobs", "utils"]
