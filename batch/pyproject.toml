[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-insights-batch"
version = "0.1.0"
description = "PySpark batch jobs for deep multi-modal video analysis"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Local development only — must match the Spark version in infra/spark/Dockerfile.
dev = ["pyspark==4.0.1"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["jobs", "utils"]
