[project]
name = "youtube-insights-batch"
version = "0.1.0"
description = "PySpark batch jobs for deep multi-modal video analysis"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["jobs", "utils"]
